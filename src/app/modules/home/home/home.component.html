<p>home works!</p>
<div class="container mx-auto p-4">
  <h2 class="text-3xl font-bold text-center mb-8">Nuestros servicios</h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <div *ngFor="let item of servicePortfolios"
      class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 ease-in-out">
      <div class="p-4">
        <h3 class="text-xl font-semibold text-gray-800 mb-2">{{ item.name }}</h3>
        <p class="text-gray-600 text-sm mb-4">{{ item.description }}</p>
        <div class="flex justify-between items-center">
          <button
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full transition-colors duration-300">
            Ingresar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
